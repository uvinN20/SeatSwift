spring.application.name=bookingSeatApplication

spring.profiles.active=dev

server.port=8081
server.servlet.context-path=/seat-booking-application

# Business timezone (used by owner analytics later)
app.timezone=Asia/Colombo

# Payment slip uploads
app.storage.payment-slips-dir=${PAYMENT_SLIP_DIR:./data/payment-slips}
app.upload.max-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Allowed browser origin for CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
