spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bus_seat_booking_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Set JWT_SECRET to a random value of at least 32 characters.
app.jwt.secret=${JWT_SECRET}

# Keep local logs inside the backend project so the application works on any computer.
logs.path=./logs

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# Local demonstration data: disable when using real operator data.
app.demo.enabled=${DEMO_DATA_ENABLED:true}
app.demo.days=${DEMO_DAYS:14}
app.demo.admin-username=${DEMO_ADMIN_USERNAME:uvin}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD}
app.demo.passenger-password=${DEMO_PASSENGER_PASSWORD}
app.demo.owner-password=${DEMO_OWNER_PASSWORD}
